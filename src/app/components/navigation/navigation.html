<nav class="navigation">
  <img class="navigation__logo" src="images/join-sidebar.png" alt="Join Logo" />
  

  <div class="navigation__links">
    @if (isLoggedIn) {
      <a
        class="navigation__link navigation__link--summary"
        routerLink="/summary"
        routerLinkActive="navigation__link--active"
        (click)="requestSummaryIntro()"
      >
        <img src="icons/summary.png" alt="Summary" />
        <span>Summary</span>
      </a>

      <a
        class="navigation__link"
        routerLink="/add-task"
        routerLinkActive="navigation__link--active"
      >
        <img src="icons/task.png" alt="Add Task" />
        <span>Add Task</span>
      </a>

      <a class="navigation__link" routerLink="/board" routerLinkActive="navigation__link--active">
        <img src="icons/board.png" alt="Board" />
        <span>Board</span>
      </a>

      <a
        class="navigation__link"
        routerLink="/contacts"
        routerLinkActive="navigation__link--active"
      >
        <img src="icons/contacts.png" alt="Contacts" />
        <span>Contacts</span>
      </a>
    } @else {
      <a class="navigation__link" routerLink="/login" routerLinkActive="navigation__link--active" [routerLinkActiveOptions]="{ exact: true }">
        <img src="icons/img/login.svg" alt="Login" />
        <span>Log in</span>
      </a>

      <a class="navigation__link navigation__mobile-legal" routerLink="/info/privacy" routerLinkActive="navigation__link--active">
        <span>Privacy Policy</span>
      </a>

      <a class="navigation__link navigation__mobile-legal" routerLink="/info/legal" routerLinkActive="navigation__link--active">
        <span>Legal notice</span>
      </a>
   
   
    }
  </div>

 
    <div class="navigation__legal">
      <a routerLink="/info/privacy" routerLinkActive="navigation__legal--active"
        >Privacy Policy</a
      >
      <a routerLink="/info/legal" routerLinkActive="navigation__legal--active">Legal notice</a>
    </div>

</nav>
